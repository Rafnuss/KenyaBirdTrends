name: Build and Deploy
on:
  push:
    branches:
      - main
  # Validate pull requests too: gating only on push to main means a broken
  # change is caught after it has already landed.
  pull_request:
    branches:
      - main
  # Republish without a code change - e.g. after syncing new species data.
  workflow_dispatch:

# Publishing used to push the built site to a gh-pages branch, which needed
# contents: write for the whole workflow. Now only the deploy job writes, and
# it asks for that itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull-request build can be dropped, but never cancel a
  # deployment that is already publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node ⚙️ # Vite 7 requires Node ^20.19 || >=22.12, so pin it rather than relying on the runner default.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Lint 🔍
        run: npm run lint:check

      - name: Test 🧪
        run: npm test

      - name: Build 🔧
        run: npm run build

      # Uploaded on pull requests too, so a PR exercises the whole deploy path
      # bar the publish itself.
      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # The site is served from this artifact rather than from a gh-pages
    # branch, so the built output is no longer committed and `dist` never
    # enters the repository's history.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
